name: Refresh live events

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect events and capture diagnostics
        run: |
          set -o pipefail
          python scripts/refresh_events.py 2>&1 | tee data/refresh-report.txt

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/events.json").read_text())
          report = Path("data/refresh-report.txt").read_text()

          assert data.get("mode") == "live", "Output is not live"
          assert isinstance(data.get("events"), list), "Events must be a list"

          if "DEGRADED REFRESH" not in report:
              assert data.get("radiusKm") == 45, "New output is not using the 45 km radius"
              assert len(data["events"]) >= 10, "New output contains fewer than 10 events"

          print(report)
          print(f"Stored dataset: {len(data['events'])} events; radius={data.get('radiusKm')} km")
          PY

      - name: Commit refreshed data and diagnostics
        run: |
          if git diff --quiet -- data/events.json data/geocode-cache.json data/refresh-report.txt; then
            echo "No event-data changes"
            exit 0
          fi
          git config user.name "parabiago-oggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/geocode-cache.json data/refresh-report.txt
          git commit -m "Refresh live events"
          git push
