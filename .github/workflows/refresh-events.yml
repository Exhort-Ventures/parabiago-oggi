name: Refresh live events

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and verify events
        run: python scripts/refresh_events.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/events.json').read_text())
          assert data.get('mode') == 'live'
          assert isinstance(data.get('events'), list)
          print(f"Validated {len(data['events'])} live events")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/events.json data/geocode-cache.json; then
            echo "No event-data changes"
            exit 0
          fi
          git config user.name "parabiago-oggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/geocode-cache.json
          git commit -m "Refresh live events"
          git push
