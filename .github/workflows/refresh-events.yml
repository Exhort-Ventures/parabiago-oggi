name: Refresh live events

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect events and capture diagnostics
        run: |
          set -o pipefail
          python scripts/refresh_events.py 2>&1 | tee data/refresh-report.txt

      - name: Run deterministic tests
        run: pytest -q

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          index = json.loads(Path("data/areas.json").read_text())
          assert {a["id"] for a in index["areas"]} == {"parabiago", "ossola"}
          for area in index["areas"]:
              data = json.loads(Path(f"data/areas/{area['id']}.json").read_text())
              assert data["area"]["radiusKm"] in (45, 30)
              assert all(e["distanceKm"] <= data["area"]["radiusKm"] for e in data["events"])
          print(Path("data/refresh-report.txt").read_text())
          PY

      - name: Commit refreshed data and diagnostics
        run: |
          if git diff --quiet -- data/areas.json data/areas data/source-health.json data/refresh-report.txt; then
            echo "No event-data changes"
            exit 0
          fi
          git config user.name "parabiago-oggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/areas.json data/areas data/source-health.json data/refresh-report.txt
          git commit -m "Refresh live events"
          git push
