<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parabiago Oggi · Stato</title><link rel="stylesheet" href="styles.css"><main><p class="eyebrow">DIAGNOSTICA INTERNA</p><h1>Stato copertura</h1><div id="status">Caricamento…</div></main><script>fetch('data/coverage-report.json?t='+Date.now()).then(r=>r.json()).then(d=>status.innerHTML=Object.entries(d.areas).map(([n,a])=>`<section class="panel context-content"><h2>${n}</h2><p><b>${a.totalFutureDateRecords}</b> record · ${a.distinctEventSeries} serie</p><p><b>Località:</b> ${a.representedTowns.join(', ')||'—'}</p><p><b>Fonti senza risultati:</b> ${a.zeroResultSources.join(', ')||'—'}</p><p><b>Fallimenti:</b> ${a.failedSources.join(', ')||'—'}</p><p><b>Avvisi:</b> ${a.warnings.join(' · ')||'nessuno'}</p></section>`).join(''))</script>
